<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}VoidOnyx Cloud Workspace & VoidPanel{% endblock %}</title>
  {% load static %}
  <link rel="shortcut icon" href="{% static 'img/logo_emblem.png' %}" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=4.1.0">
  {% block extra_head %}{% endblock %}
</head>
<body>

  {% block content %}{% endblock %}

  <div id="toast-container" class="toast-container"></div>

  {% load static %}
  <script src="{% static 'js/app.js' %}?v=2.4.0"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
