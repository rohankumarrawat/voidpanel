<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Not Found | VoidMail Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #0F172A;
    }
    .box {
      background: white;
      border: 1.5px solid #E2E8F0;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }
    .icon-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #FEE2E2;
      color: #DC2626;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      font-size: 13.5px;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0F172A;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon-circle">
      <i class="fa-regular fa-calendar-xmark"></i>
    </div>
    <h1>Booking Page Not Found</h1>
    <p>
      The booking link for <strong>"{{ requested_username }}"</strong> is either unavailable or does not exist on this server. Please check the spelling or ask the host for an updated link.
    </p>
    <a href="https://mail.voidonyx.in" class="btn">
      <i class="fa-solid fa-arrow-left"></i> Return to VoidMail
    </a>
  </div>
</body>
</html>
