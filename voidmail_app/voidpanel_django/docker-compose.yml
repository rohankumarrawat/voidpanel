version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - vmail_data:/var/vmail
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=voidonyx_dev_secret_key_change_in_production_2026
      - DATABASE_URL=postgres://voidmail_user:voidmail_pass@db:5432/voidmail_db
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=voidmail_db
      - POSTGRES_USER=voidmail_user
      - POSTGRES_PASSWORD=voidmail_pass
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  vmail_data:
