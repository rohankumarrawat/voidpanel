<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luckysheet Test</title>
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/pluginsCss.css' />
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/plugins.css' />
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/css/luckysheet.css' />
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/assets/iconfont/iconfont.css' />
  <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/js/plugin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/luckysheet.umd.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    #sheet-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <div id="sheet-container"></div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      luckysheet.create({
        container: 'sheet-container',
        title: 'Untitled Sheet',
        lang: 'en',
        showinfobar: true,
        showsheetbar: true,
        showstatisticBar: true,
        enableAddRow: true,
        enableAddBackTop: true,
        data: [{
          name: "Sheet1",
          color: "",
          status: 1,
          order: 0,
          data: [
            [{ v: "Product", m: "Product", ct: { fa: "@", t: "s" }, bg: "#E6F4EA", bl: 1 }, { v: "Category", m: "Category", bg: "#E6F4EA", bl: 1 }, { v: "Price", m: "Price", bg: "#E6F4EA", bl: 1 }, { v: "Quantity", m: "Quantity", bg: "#E6F4EA", bl: 1 }, { v: "Total", m: "Total", bg: "#E6F4EA", bl: 1 }],
            [{ v: "Laptop Pro", m: "Laptop Pro" }, { v: "Computers", m: "Computers" }, { v: 1200, m: "$1,200" }, { v: 4, m: "4" }, { f: "=C2*D2", v: 4800, m: "$4,800" }],
            [{ v: "Wireless Mouse", m: "Wireless Mouse" }, { v: "Accessories", m: "Accessories" }, { v: 25, m: "$25" }, { v: 10, m: "10" }, { f: "=C3*D3", v: 250, m: "$250" }],
            [{ v: "Mechanical Keyboard", m: "Mechanical Keyboard" }, { v: "Accessories", m: "Accessories" }, { v: 80, m: "$80" }, { v: 5, m: "5" }, { f: "=C4*D4", v: 400, m: "$400" }],
            [{ v: "Total Revenue", m: "Total Revenue", bl: 1 }, { v: "", m: "" }, { v: "", m: "" }, { v: "", m: "" }, { f: "=SUM(E2:E4)", v: 5450, m: "$5,450", bl: 1, bg: "#FEF3C7" }]
          ],
          config: {
            columnlen: { 0: 160, 1: 130, 2: 90, 3: 90, 4: 120 }
          }
        }]
      });
    });
  </script>
</body>
</html>
