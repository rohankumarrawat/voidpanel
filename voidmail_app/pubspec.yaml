name: voidmail_app
description: "VoidMail — by VoidOnyx (Enterprise & Personal Mail Client)"
publish_to: 'none'

version: 1.0.21+32
environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  enough_mail: ^2.1.4
  file_picker: ^8.0.3
  flutter_widget_from_html_core: ^0.15.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/google_console_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icon/
    - assets/icon/google_console_icon.png
    - assets/google_console_icon.png
