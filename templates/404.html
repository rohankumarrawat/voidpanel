<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Page Not Found | VoidPanel</title>
<link rel="icon" href="/static/fav.png" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #060d1a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }
  .bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .g1 {
    position: absolute;
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
    top: -100px;
    right: -100px;
    animation: float 9s ease-in-out infinite;
  }
  .g2 {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
    bottom: -80px;
    left: -80px;
    animation: float 11s ease-in-out infinite reverse;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  .card {
    position: relative;
    z-index: 1;
    background: rgba(13, 22, 38, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px);
    border-radius: 24px;
    padding: 44px 40px;
    max-width: 580px;
    width: 100%;
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
    text-align: center;
  }
  .icon-wrap {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(79, 70, 229, 0.05));
    border: 1px solid rgba(99, 102, 241, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: #818cf8;
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.15);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.25);
    color: #c7d2fe;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }
  .badge .dot {
    width: 6px;
    height: 6px;
    background: #818cf8;
    border-radius: 50%;
  }
  h1 {
    font-size: 1.65rem;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.25;
    margin-bottom: 12px;
  }
  .sub {
    font-size: 0.92rem;
    color: #94a3b8;
    line-height: 1.65;
    margin-bottom: 28px;
  }
  .btn-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 12px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #4f46e5, #4338ca);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #cbd5e1;
  }
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.09);
    color: #ffffff;
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-1px);
  }
  .footer-meta {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    color: #64748b;
  }
  .footer-meta a {
    color: #818cf8;
    text-decoration: none;
  }
  .footer-meta a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="bg">
  <div class="g1"></div>
  <div class="g2"></div>
</div>

<div class="card">
  <div class="icon-wrap">
    <i class="fa-solid fa-compass"></i>
  </div>

  <div class="badge">
    <span class="dot"></span>
    HTTP 404 &bull; Page Not Found
  </div>

  <h1>Page Not Found</h1>
  
  <p class="sub">
    The page or resource you are looking for might have been moved, renamed, or is temporarily unavailable.
  </p>

  <div class="btn-group">
    <a href="javascript:history.back()" class="btn btn-primary">
      <i class="fa-solid fa-arrow-left"></i> Go Back
    </a>

    <a href="/control/suite/login/" class="btn btn-secondary">
      <i class="fa-solid fa-layer-group"></i> Suite Portal
    </a>

    <a href="/control/" class="btn btn-secondary">
      <i class="fa-solid fa-gauge-high"></i> Dashboard
    </a>
  </div>

  <div class="footer-meta">
    <span>VoidPanel Application Engine</span>
    <a href="/"><i class="fa-solid fa-house"></i> Home</a>
  </div>
</div>
</body>
</html>
