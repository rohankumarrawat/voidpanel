version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: voidonyx_whois_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voidonyx_whois_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/voidonyx_whois
      - NODE_ENV=production
      - CACHE_TTL_SECONDS=3600
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=10
    depends_on:
      - mongodb
    restart: always

volumes:
  mongo_data:
