server {
    listen 80;
    server_name tools.voidonyx.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tools.voidonyx.in;

    # SSL — Managed by VoidPanel / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/tools.voidonyx.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.voidonyx.in/privkey.pem;

    # Serve React frontend build
    root /public_html/tools;
    index index.html;

    # React Router — serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Express backend on port 4100
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
